<script>
(function () {
  'use strict';

  function longDate(value) {
    if (!value) return '';
    return new Date(value + 'T00:00:00').toLocaleDateString('en-US', {
      year: 'numeric', month: 'long', day: 'numeric'
    });
  }

  function boot() {
    var list = document.getElementById('journal-list');
    var empty = document.getElementById('journal-empty');
    var esc = window.gf.escape;

    fetch('/content/data/journal.json')
      .then(function (res) {
        if (!res.ok) throw new Error('journal.json ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var published = (data.posts || []).filter(function (p) {
          return p.status === 'published';
        });

        if (!published.length) {
          empty.hidden = false;
          return;
        }

        list.innerHTML = published.map(function (post) {
          /* First non-empty paragraph as the excerpt, capped — same rule as
             before the rebrand. */
          var first = (post.body || '').split(/\n\n+/).find(function (p) { return p.trim(); }) || '';
          var excerpt = first.length > 220 ? first.slice(0, 220).trimEnd() + '…' : first;

          return '' +
            '<a class="gf-journal-card" href="journal-post.html?slug=' +
            encodeURIComponent(post.slug) + '">' +
            '<div class="gf-meta" style="color: var(--gf-ink-soft)">' +
            esc(longDate(post.date)) +
            ((post.tags && post.tags.length) ? '<br>' + esc(post.tags[0]) : '') +
            '</div>' +
            '<div>' +
            '<h2>' + esc(post.title) + '</h2>' +
            '<p>' + esc(excerpt) + '</p>' +
            '</div>' +
            '</a>';
        }).join('');
      })
      .catch(function (err) {
        empty.textContent = 'The journal could not be loaded.';
        empty.hidden = false;
        console.error(err);
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
