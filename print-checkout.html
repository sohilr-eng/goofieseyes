<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Store | GoofiesEyes</title>
  <meta name="robots" content="noindex, nofollow" />
  <!-- Retired: single-print checkout. Old links and old Stripe cancel URLs
       still point here, so forward them to the product page, keeping the
       print and format. -->
  <script>
    (function () {
      var q = new URLSearchParams(window.location.search);
      var id = q.get('product');
      var format = q.get('type') === 'digital' ? 'digital' : 'physical';
      window.location.replace(id
        ? 'product.html?id=' + encodeURIComponent(id) + '&format=' + format
        : 'store.html');
    })();
  </script>
</head>
<body>
  <p><a href="store.html">Continue to the store</a></p>
</body>
</html>
