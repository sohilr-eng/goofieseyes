<script>
(function () {
  'use strict';

  function boot() {
    var grid = document.getElementById('crate-grid');
    var state = document.getElementById('crate-state');

    window.gf.loadAlbums()
      .then(function (albums) {
        if (!albums.length) {
          state.textContent = 'No collections yet.';
          return;
        }
        grid.innerHTML = albums.map(window.gf.recordHTML).join('');
        document.getElementById('crate-total').textContent = albums.length;
        state.hidden = true;

        /* Keep the structured data in step with what is actually on the page,
           rather than a hand-maintained list that goes stale — which is exactly
           what happened to the previous version of this file. */
        var ld = document.getElementById('crate-ld');
        try {
          var data = JSON.parse(ld.textContent);
          data.hasPart = albums.map(function (a) {
            return {
              '@type': 'ImageGallery',
              name: a.title,
              url: 'https://goofieseyes.live/' + a.href
            };
          });
          ld.textContent = JSON.stringify(data, null, 2);
        } catch (e) { /* structured data is a nicety, never a blocker */ }
      })
      .catch(function (err) {
        state.textContent = 'The collections could not be loaded.';
        console.error(err);
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
