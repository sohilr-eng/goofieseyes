<script>
(function () {
  'use strict';

  var esc = function (s) { return window.gf.escape(s); };

  /* Minimal block formatter: blank lines separate paragraphs, a leading > makes
     a blockquote. Content is escaped first, so post bodies cannot inject markup. */
  function bodyToHTML(text) {
    return (text || '').split(/\n\n+/).map(function (block) {
      block = block.trim();
      if (!block) return '';
      if (block.charAt(0) === '>') {
        return '<blockquote>' + esc(block.replace(/^>\s?/gm, '').trim()) + '</blockquote>';
      }
      return '<p>' + esc(block).replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function longDate(value) {
    if (!value) return '';
    return new Date(value + 'T00:00:00').toLocaleDateString('en-US', {
      year: 'numeric', month: 'long', day: 'numeric'
    });
  }

  function boot() {
    var slug = new URLSearchParams(window.location.search).get('slug');
    var content = document.getElementById('post-content');
    var error = document.getElementById('post-error');

    if (!slug) { error.hidden = false; return; }

    fetch('/content/data/journal.json')
      .then(function (res) {
        if (!res.ok) throw new Error('journal.json ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var post = (data.posts || []).find(function (p) { return p.slug === slug; });
        if (!post) { error.hidden = false; return; }

        document.title = post.title + ' | GoofiesEyes Journal';
        document.getElementById('canonical').href =
          'https://goofieseyes.live/journal-post.html?slug=' + encodeURIComponent(post.slug);

        var meta = esc(longDate(post.date));
        if (post.tags && post.tags.length) meta += ' · ' + esc(post.tags.join(' · '));

        var hero = post.coverImage
          ? '<img src="/content/photos/' + esc(post.coverImage) + '" alt="' +
            esc(post.title) + '" loading="lazy" decoding="async">'
          : '';

        content.innerHTML =
          '<p class="gf-meta" style="color: var(--gf-ink-soft)">' + meta + '</p>' +
          '<h1>' + esc(post.title) + '</h1>' +
          hero +
          '<div class="gf-post-body">' + bodyToHTML(post.body) + '</div>';
      })
      .catch(function (err) {
        error.textContent = 'The entry could not be loaded.';
        error.hidden = false;
        console.error(err);
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
