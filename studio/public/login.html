<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>goofieseyes studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <main class="login">
    <form id="login">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="mark" aria-hidden="true"></div>
        <h1 class="wordmark">goofieseyes<span>studio</span></h1>
      </div>
      <label class="label" for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button class="btn primary" type="submit">Sign in</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </main>
  <script>
    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value }),
      });
      if (res.ok) { location.href = '/'; return; }
      const data = await res.json().catch(() => ({}));
      error.textContent = data.error || 'Sign-in failed';
    });
  </script>
</body>
</html>
