</main>

<script>
(function () {
  'use strict';

  function boot() {
    var params = new URLSearchParams(window.location.search);
    var sessionId = params.get('session_id');
    var isDigital = params.get('type') === 'digital';

    document.getElementById('order-kind').textContent =
      isDigital ? 'Digital download' : 'Fine art print';

    document.getElementById('order-body').textContent = isDigital
      ? 'Your full-resolution file is on its way to the email address you gave at checkout. If it has not arrived within a few minutes, check your spam folder.'
      : 'Thank you. Your print will be made and shipped, and you will get a confirmation email with tracking as soon as it is on its way.';

    var ref = document.getElementById('order-ref');
    if (sessionId) {
      /* Stripe session ids are long; a short uppercase stub is enough to quote
         back in an email. */
      ref.textContent = 'Order ref: ' +
        sessionId.replace(/^cs_(live|test)_/, '').substring(0, 16).toUpperCase();
    } else {
      ref.textContent = 'Your order has been received.';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
