<div class="gf-lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph">
  <button class="gf-lb-close" id="lb-close" type="button" aria-label="Close">&#10005;</button>
  <button class="gf-lb-prev" id="lb-prev" type="button" aria-label="Previous">&#8249;</button>
  <button class="gf-lb-next" id="lb-next" type="button" aria-label="Next">&#8250;</button>
  <img id="lb-img" alt="">
  <span class="gf-lb-count" id="lb-count"></span>
</div>

<script>
/* Selects — every photograph starred in the admin photo grid, across all
   collections. Previously this page was ten hardcoded <img> tags maintained by
   hand; it is now driven by the same portfolios.json as everything else. */
(function () {
  'use strict';

  var photos = [];
  var index = 0;

  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lb-img');
  var lbCount = document.getElementById('lb-count');
  var lastFocused = null;

  function show() {
    var photo = photos[index];
    lbImg.src = '/content/photos/' + photo.filename;
    lbImg.alt = photo.alt || photo.title || '';
    lbCount.textContent = (index + 1) + ' / ' + photos.length + ' · ' + photo.album;
  }

  function open(i) {
    lastFocused = document.activeElement;
    index = i;
    show();
    lb.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    document.getElementById('lb-close').focus();
  }

  function close() {
    lb.classList.remove('is-open');
    document.body.style.overflow = '';
    if (lastFocused) lastFocused.focus();
  }

  function step(delta) {
    index = (index + delta + photos.length) % photos.length;
    show();
  }

  document.getElementById('lb-close').addEventListener('click', close);
  document.getElementById('lb-prev').addEventListener('click', function () { step(-1); });
  document.getElementById('lb-next').addEventListener('click', function () { step(1); });
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });

  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('is-open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  function boot() {
    var state = document.getElementById('state-message');
    var grid = document.getElementById('photo-grid');

    window.gf.loadAlbums()
      .then(function (albums) {
        albums.forEach(function (album) {
          album.photos.forEach(function (photo) {
            if (photo.selected) {
              photos.push({
                filename: photo.filename,
                alt: photo.alt,
                title: photo.title,
                album: album.title
              });
            }
          });
        });

        if (!photos.length) {
          state.innerHTML = 'No selects yet. Star photographs in the admin portal to fill this page.';
          return;
        }

        grid.innerHTML = photos.map(function (photo, n) {
          return '<button class="gf-photo" type="button" data-index="' + n + '"' +
            ' aria-label="View ' + window.gf.escape(photo.alt || photo.title || ('photograph ' + (n + 1))) + '">' +
            '<img src="/content/photos/' + window.gf.escape(photo.filename) + '"' +
            ' alt="' + window.gf.escape(photo.alt || photo.title || '') + '" loading="lazy" decoding="async">' +
            '</button>';
        }).join('');

        grid.addEventListener('click', function (e) {
          var button = e.target.closest('.gf-photo');
          if (button) open(Number(button.dataset.index));
        });

        document.getElementById('selects-total').textContent = photos.length;
        state.hidden = true;
        grid.hidden = false;
      })
      .catch(function (err) {
        state.textContent = 'The selects could not be loaded.';
        console.error(err);
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
